<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check-in prompt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2456D6}a:hover{color:#173E9E}
</style>
</helmet>
<div style="width: 440px; height: 340px; box-sizing: border-box; padding: 20px; background: #EEF1F6; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F1A2B; display: flex">
<div role="alertdialog" aria-labelledby="prompt-title" style="flex: 1; background: #FFFFFF; border: 1px solid #F5D08A; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 12px; align-items: flex-start">
<span style="flex: none; width: 40px; height: 40px; border-radius: 14px; background: #FFF1D6; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A4A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
<div style="display: flex; flex-direction: column; gap: 3px">
<div id="prompt-title" style="font-size: 17px; font-weight: 800">Has Ngozi E. arrived?</div>
<div style="font-size: 13px; color: #5B6678">Due 11:50 with Zainab · 15 min ago, not checked in</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; font-weight: 700; color: #5B6678">She arrived</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<button aria-pressed="true" style="all: unset; box-sizing: border-box; min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 20px; background: #E8EFFD; border: 2px solid #2456D6; color: #173E9E; font-size: 13px; font-weight: 700; cursor: pointer">Just now</button>
<button style="all: unset; box-sizing: border-box; min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 20px; border: 1px solid #CDD6E3; font-size: 13px; cursor: pointer">5 min ago</button>
<button style="all: unset; box-sizing: border-box; min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 20px; border: 1px solid #CDD6E3; font-size: 13px; cursor: pointer">10 min ago</button>
<button style="all: unset; box-sizing: border-box; min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 20px; border: 1px solid #CDD6E3; font-size: 13px; cursor: pointer">On time</button>
</div>
</div>
<div style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px; margin-top: auto">
<button style="all: unset; box-sizing: border-box; min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 24px; background: #2456D6; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">Check in</button>
<button style="all: unset; box-sizing: border-box; min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 24px; border: 1px solid #CDD6E3; color: #A12828; font-size: 14px; font-weight: 700; cursor: pointer">No-show</button>
</div>
<button style="all: unset; align-self: center; min-height: 32px; font-size: 13px; font-weight: 600; color: #2456D6; cursor: pointer">Not yet, ask again in 5 min</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":340}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
